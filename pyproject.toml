[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "engine-health-monitoring"
version = "0.1.0"
description = "Auditable remaining-life prediction under sensor degradation"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2,<3", "pandas>=3,<4", "torch>=2.14,<3", "scikit-learn>=1.9,<2", "matplotlib>=3.11,<4"]

[project.optional-dependencies]
demo = ["streamlit==1.64.0", "plotly>=6,<7"]
dev = ["pytest>=9,<10", "ruff>=0.15"]

[project.scripts]
engine-health = "engine_health.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
